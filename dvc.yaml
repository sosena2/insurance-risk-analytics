stages:
  clean_data:
    cmd: python src/clean_data.py data/MachineLearningRating_v3.txt data/cleaned_insurance_data.txt
    deps:
      - data/MachineLearningRating_v3.txt
      - src/clean_data.py
    # The cleaned dataset is versioned separately in data/cleaned_insurance_data.txt.dvc.
    # This stage documents the transformation lineage from the raw DVC-tracked input
    # to the cleaned dataset artifact used by downstream analysis.